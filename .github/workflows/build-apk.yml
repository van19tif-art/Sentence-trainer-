name: Build Sentence Trainer APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q SentenceTrainer-Android-CloudBuild.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find project -name settings.gradle -o -name settings.gradle.kts
          find project -name build.gradle -o -name build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure AndroidX
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)")

          echo "Project directory: $PROJECT_DIR"

          touch "$PROJECT_DIR/gradle.properties"

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Create Kotlin compatibility script
        run: |
          cat > /tmp/force-kotlin.gradle <<'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                          details.because("Use one compatible Kotlin version to prevent duplicate classes")
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)")

          echo "Building project in: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --init-script /tmp/force-kotlin.gradle \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          APK=$(find project -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" SentenceTrainer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SentenceTrainer-APK
          path: SentenceTrainer.apk
